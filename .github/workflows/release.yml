name: Automated release

on:
    pull_request:
        types: [closed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release-main
    cancel-in-progress: false

jobs:
    release:
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Bump release version files
              id: version
              run: |
                  next_version="$(node scripts/prepare-release.mjs)"
                  npm install --package-lock-only
                  echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

            - name: Commit and tag release
              run: |
                  version="${{ steps.version.outputs.next_version }}"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json manifest.json versions.json
                  git commit -m "chore: release $version [skip ci]"
                  git tag "$version"
                  git push origin HEAD:main
                  git push origin "$version"

            - name: Build release artifacts
              run: |
                  npm ci
                  npm test
                  npm run lint
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="${{ steps.version.outputs.next_version }}"
                  assets=(main.js manifest.json)
                  if [[ "${{ steps.styles.outputs.exists }}" == "true" ]]; then
                    assets+=(styles.css)
                  fi
                  gh release create "$version" --title="$version" "${assets[@]}"
